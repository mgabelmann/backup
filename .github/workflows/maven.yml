#this workflow will build the project
name: Java CI with Maven 4.1

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  #run manually
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven 4.1.0
        uses: stcarolas/setup-maven@v5
        with:
          maven-version: '4.1.0'

      - name: Build with Maven 4.1.0
        run: mvn -s $GITHUB_WORKSPACE/.github/workflows/settings.xml -B verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTION_PAT: ${{ secrets.ACTION_PAT }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
