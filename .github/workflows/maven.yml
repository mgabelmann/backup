#this workflow will build the project
name: Java CI with Maven 4.1

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  #run manually
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: 'github'
          mvn-repositories: |
            github:https://maven.pkg.github.com/mgabelmann/repository:true

      - name: Set up Apache Maven 4.1.0
        uses: stcarolas/setup-maven@v5
        with:
          maven-version: '4.0.0-rc-7'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B verify
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS }}